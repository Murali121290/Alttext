{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold text-slate-800">Admin Dashboard</h2>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center text-blue-500">
                    <i data-lucide="users" class="h-6 w-6"></i>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-500">Total Users</p>
                    <p class="text-2xl font-bold text-slate-800">{{ stats.user_count }}</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-purple-50 flex items-center justify-center text-purple-500">
                    <i data-lucide="layers" class="h-6 w-6"></i>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-500">Total Batches</p>
                    <p class="text-2xl font-bold text-slate-800">{{ stats.batch_count }}</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-amber-50 flex items-center justify-center text-amber-500">
                    <i data-lucide="file-text" class="h-6 w-6"></i>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-500">Total Jobs</p>
                    <p class="text-2xl font-bold text-slate-800">{{ stats.job_count }}</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-500">
                    <i data-lucide="dollar-sign" class="h-6 w-6"></i>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-500">Total Cost</p>
                    <p class="text-2xl font-bold text-slate-800">${{ "%.2f"|format(stats.total_cost) }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
