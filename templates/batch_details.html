{% extends "base.html" %}

{% block content %}
<div class="space-y-6" x-data="batchDetails({{ batch_id }})">
    <!-- Breadcrumb & Header -->
    <div>
        <a href="{{ url_for('batches_page') }}"
            class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700 mb-4 transition-colors">
            <i data-lucide="arrow-left" class="h-4 w-4"></i>
            Back to Batches
        </a>
        <div class="flex items-start justify-between">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-3">
                    <span x-text="batch?.name || 'Loading...'"></span>
                    <!-- Status Badge -->
                    <template x-if="batch">
                        <span class="px-2.5 py-1 rounded-full text-xs font-medium border" :class="{
                                'bg-emerald-50 text-emerald-700 border-emerald-100': batch.status === 'completed',
                                'bg-amber-50 text-amber-700 border-amber-100': batch.status === 'processing',
                                'bg-red-50 text-red-700 border-red-100': batch.status === 'failed',
                                'bg-slate-50 text-slate-700 border-slate-100': batch.status === 'pending'
                            }">
                            <span x-text="capitalize(batch.status)"></span>
                        </span>
                    </template>
                </h1>
                <p class="text-slate-500 mt-1" x-show="batch">
                    Created on <span x-text="formatDate(batch.created_at)"></span>
                </p>
            </div>
            <button @click="refresh()"
                class="p-2 rounded-xl text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition-colors">
                <i data-lucide="refresh-cw" class="h-5 w-5" :class="{ 'animate-spin': loading }"></i>
            </button>
        </div>
    </div>

    <!-- Jobs List -->
    <div class="bg-white rounded-2xl border border-slate-200/60 shadow-sm shadow-slate-200/50 overflow-hidden">
        <div
            class="px-6 py-4 border-b border-slate-100 bg-slate-50/50 grid grid-cols-12 gap-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <div class="col-span-5">File Name</div>
            <div class="col-span-2">Status</div>
            <div class="col-span-3">Tokens / Cost</div>
            <div class="col-span-2 text-right">Actions</div>
        </div>

        <div class="divide-y divide-slate-100">
            <template x-for="job in jobs" :key="job.job_id">
                <div class="grid grid-cols-12 gap-4 px-6 py-4 items-center hover:bg-slate-50 transition-colors">

                    <!-- File Name -->
                    <div class="col-span-5 flex items-center gap-3 min-w-0">
                        <div class="p-2 rounded-lg bg-slate-100 flex-shrink-0">
                            <i data-lucide="file-text" class="h-5 w-5 text-slate-500"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="font-medium text-slate-800 text-sm truncate" x-text="job.filename"></p>
                            <p class="text-xs text-slate-400" x-text="'ID: ' + job.job_id"></p>
                            <div x-show="job.status === 'failed' && job.error_message"
                                class="mt-1.5 flex items-start gap-1.5 text-xs text-red-700 bg-red-50 border border-red-200 rounded-md px-2 py-1.5">
                                <i data-lucide="alert-triangle" class="w-3.5 h-3.5 flex-shrink-0 mt-px"></i>
                                <span x-text="job.error_message"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Status -->
                    <div class="col-span-2">
                        <span
                            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border"
                            :class="{
                                'bg-emerald-50 text-emerald-700 border-emerald-100': job.status === 'completed',
                                'bg-amber-50 text-amber-700 border-amber-100': job.status === 'processing',
                                'bg-red-50 text-red-700 border-red-100': job.status === 'failed',
                                'bg-slate-50 text-slate-700 border-slate-100': job.status === 'pending'
                            }">
                            <span x-text="capitalize(job.status)"></span>
                        </span>
                    </div>

                    <!-- Stats -->
                    <div class="col-span-3">
                        <div x-show="job.status === 'completed'">
                            <p class="text-sm font-medium text-slate-700"
                                x-text="formatNumber(job.input_tokens + job.output_tokens) + ' tokens'"></p>
                            <p class="text-xs text-emerald-600 font-medium" x-text="formatCost(job.cost.total)"></p>
                        </div>
                        <div x-show="job.status !== 'completed'" class="text-slate-400 text-sm">-</div>
                    </div>

                    <!-- Actions -->
                    <div class="col-span-2 text-right">
                        <template x-if="job.status === 'completed' && job.output_file && !job.output_file.endsWith('_validated.xlsx')">
                            <a :href="'/review/' + job.job_id"
                                class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 hover:text-blue-800 transition-colors text-sm font-medium border border-blue-200">
                                <i data-lucide="eye" class="h-4 w-4"></i>
                                Review
                            </a>
                            <a :href="'/download/' + job.output_file"
                                class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 hover:text-emerald-800 transition-colors text-sm font-medium border border-emerald-200">
                                <i data-lucide="download" class="h-4 w-4"></i>
                                Download
                            </a>
                        </template>
                        <template x-if="job.status === 'processing'">
                            <span class="text-xs text-amber-600 animate-pulse">Processing...</span>
                        </template>
                        <template x-if="job.status === 'failed'">
                            <div class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-red-50 text-red-700 border border-red-200 text-xs font-medium">
                                <i data-lucide="alert-triangle" class="w-3.5 h-3.5 pointer-events-none"></i>
                                Contact Administrator
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <div x-show="!loading && jobs.length === 0" class="py-12 text-center text-slate-500">
                No jobs found in this batch.
            </div>

            <div x-show="loading && !batch" class="py-12 text-center">
                <i data-lucide="loader-2" class="h-8 w-8 text-amber-500 animate-spin mx-auto mb-2"></i>
                <p class="text-sm text-slate-500">Loading details...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('batchDetails', (batchId) => ({
            batch: null,
            jobs: [],
            loading: false,
            init() {
                this.refresh();
                // Poll if batch is not completed/failed
                this.pollInterval = setInterval(() => {
                    if (this.batch && (this.batch.status === 'pending' || this.batch.status === 'processing')) {
                        this.refresh(true);
                    }
                }, 3000);
            },
            downloadedJobs: new Set(),
            async refresh(silent = false) {
                if (!silent) this.loading = true;
                try {
                    const res = await fetch(`/api/queue/batch/${batchId}`, { credentials: 'same-origin' });
                    if (res.ok) {
                        const data = await res.json();

                        // First load: mark existing completed jobs as downloaded to avoid flooding on refresh
                        if (!this.batch && data.jobs) {
                            data.jobs.forEach(j => {
                                if (j.status === 'completed') {
                                    this.downloadedJobs.add(j.job_id); // Change to add logic if you want to force download on refresh too
                                    // For now, we assume user doesn't want to re-download 50 files on F5
                                    // BUT, user asked "once process completed download automatically". 
                                    // If they just got redirected here, the job might be processing.
                                    // If they refresh, maybe they missed the download? 
                                    // Let's stick to: only download if WE witness the completion, OR if it's the very first load and it's fresh?
                                    // Actually, let's ONLY download if we see the transition or if it completes while we watch.
                                    // If we land on page and it's ALREADY completed, we probably shouldn't auto download unless we know we just came from upload.
                                    // Let's simply track what we've "handled".
                                    // Re-reading request: "once process completed download automatically"
                                }
                            });
                        }

                        this.batch = {
                            name: data.name,
                            status: data.status,
                            created_at: data.created_at,
                            batch_id: data.batch_id
                        };
                        this.jobs = data.jobs;

                        // Check for new completions
                        this.jobs.forEach(job => {
                            if (job.status === 'completed' && job.output_file && !this.downloadedJobs.has(job.job_id)) {
                                this.downloadedJobs.add(job.job_id);
                                this.triggerDownload(job.output_file);
                            }
                        });
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    if (!silent) this.loading = false;
                }
            },
            triggerDownload(filename) {
                // Create invisible link and click it
                const link = document.createElement('a');
                link.href = '/download/' + filename;
                link.download = filename; // Optional
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Show a small toast or log
                console.log("Auto-downloading", filename);
            },
            formatDate(dateStr) {
                if (!dateStr) return '';
                return new Date(dateStr).toLocaleString();
            },
            formatNumber(num) {
                return num ? num.toLocaleString() : '0';
            },
            formatCost(cost) {
                if (!cost) return '$0.00';
                if (cost < 0.01) return '$' + cost.toFixed(4);
                return '$' + cost.toFixed(2);
            },
            capitalize(str) {
                return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
            }
        }))
    });
</script>
{% endblock %}
