{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-20 text-center">
    <div class="h-24 w-24 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
        <i data-lucide="alert-triangle" class="h-12 w-12"></i>
    </div>
    <h1 class="text-2xl font-bold text-slate-800 mb-2">Access Denied</h1>
    <p class="text-slate-500 mb-8">{{ message or "You do not have permission to view this page." }}</p>

    <a href="{{ url_for('index') }}"
        class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-slate-900 text-white font-medium hover:bg-slate-800 transition-colors">
        <i data-lucide="arrow-left" class="h-4 w-4"></i>
        Return Home
    </a>
</div>
{% endblock %}
