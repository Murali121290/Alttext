{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('admin_users') }}"
            class="p-2 rounded-xl hover:bg-slate-100 text-slate-500 hover:text-slate-700 transition-colors">
            <i data-lucide="arrow-left" class="h-5 w-5"></i>
        </a>
        <h2 class="text-2xl font-bold text-slate-800">Create New User</h2>
    </div>

    <!-- Create User Form -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 max-w-2xl">
        <form action="{{ url_for('admin_create_user') }}" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i data-lucide="user" class="h-5 w-5"></i>
                    </span>
                    <input type="text" name="username" required
                        class="w-full pl-10 px-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all placeholder-slate-400"
                        placeholder="e.g. john_doe">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i data-lucide="lock" class="h-5 w-5"></i>
                    </span>
                    <input type="password" name="password" required
                        class="w-full pl-10 px-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all placeholder-slate-400"
                        placeholder="••••••••">
                </div>
                <p class="mt-1 text-xs text-slate-500">Provide a strong password for initial access.</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Role</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i data-lucide="shield" class="h-5 w-5"></i>
                    </span>
                    <select name="role"
                        class="w-full pl-10 px-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition-all bg-white">
                        <option value="user">User</option>
                        <option value="admin">Administrator</option>
                        <option value="PPD">PPD</option>
                        <option value="COPYEDIT">Copyedit</option>
                        <option value="PM">Project Manager</option>
                        <option value="PERMISSIONS">Permissions</option>
                    </select>
                </div>
                <p class="mt-1 text-xs text-slate-500">Determines access level and permissions.</p>
            </div>

            <div class="pt-6 flex items-center justify-end gap-3 border-t border-slate-100">
                <a href="{{ url_for('admin_users') }}"
                    class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium hover:bg-slate-50 transition-colors">
                    Cancel
                </a>
                <button type="submit" style="background-color: #10b981; color: white;"
                    class="px-5 py-2.5 rounded-xl bg-emerald-500 text-white font-medium hover:bg-emerald-600 shadow-md shadow-emerald-500/20 transition-all flex items-center gap-2">
                    <i data-lucide="check" class="h-5 w-5"></i>
                    Create User
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
