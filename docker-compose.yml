version: '3.8'

services:
  web:
    build: .
    container_name: alttext_app
    ports:
      - "5001:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./markup_sessions:/app/markup_sessions
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/alttext
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - default
      - shared_network

  db:
    image: postgres:15-alpine
    container_name: alttext_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=alttext
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - default

networks:
  default: {}
  shared_network:
    external: true
